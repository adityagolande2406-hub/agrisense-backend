services:
  - type: web
    name: agrisense-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: USE_MOCK_INFERENCE
        value: "false"
      - key: USE_EMBEDDED_INFERENCE
        value: "true"
      - key: MODEL_PATH
        value: model/grape_disease_model.pth
      - key: JWT_SECRET_KEY
        generateValue: true
